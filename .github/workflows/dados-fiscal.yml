name: Atualizar contas públicas (Banco Central)
# Baixa do Banco Central (SGS) o resultado primário, os juros e o resultado nominal do setor público,
# em % do PIB, e grava site/data/contas_publicas.json.
# Roda toda semana e pode ser disparado à mão em Actions → "Atualizar contas públicas (Banco Central)" → Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'   # toda segunda-feira, 06h23 em Brasília (o Banco Central publica as estatísticas fiscais no fim de cada mês)
permissions:
  contents: write
concurrency: dados-fiscal
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/coletar_fiscal.py
      - name: Gravar no repositório se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/contas_publicas.json site/data/contas_publicas.json
          git diff --cached --quiet && echo "Sem mudanças." && exit 0
          git commit -m "Dados: contas públicas (Banco Central), coleta automática"
          git push
