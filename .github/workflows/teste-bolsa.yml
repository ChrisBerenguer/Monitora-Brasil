name: Teste download Bolsa Família (temporário)
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set -x
          curl -sSIL -m 60 -A "Mozilla/5.0 MonitoraBrasil" https://portaldatransparencia.gov.br/download-de-dados/novo-bolsa-familia/202510 | grep -iE "^(HTTP|location|content-length|content-type)" || true
          time curl -sSL -m 1200 -A "Mozilla/5.0 MonitoraBrasil" -o nbf.zip https://portaldatransparencia.gov.br/download-de-dados/novo-bolsa-familia/202510 || true
          ls -la nbf.zip; unzip -l nbf.zip || true
          unzip -p nbf.zip | head -3 | iconv -f latin1 -t utf-8
          time (unzip -p nbf.zip | wc -l)
          curl -sSIL -m 60 -A "Mozilla/5.0 MonitoraBrasil" https://portaldatransparencia.gov.br/download-de-dados/bolsa-familia-pagamentos/202112 | grep -iE "^(HTTP|location|content-length)" || true
          curl -sSIL -m 60 -A "Mozilla/5.0 MonitoraBrasil" https://portaldatransparencia.gov.br/download-de-dados/auxilio-brasil/202212 | grep -iE "^(HTTP|location|content-length)" || true
          curl -sSIL -m 60 -A "Mozilla/5.0 MonitoraBrasil" https://portaldatransparencia.gov.br/download-de-dados/bolsa-familia-pagamentos/201901 | grep -iE "^(HTTP|location|content-length)" || true
