name: Explorar fontes (temporário)
on:
  push:
    branches: [explorar-fontes]
    paths: ['tmp_explorar/*.py', '.github/workflows/explorar-fontes.yml']
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmp_explorar/explorar.py > tmp_explorar/saida.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_explorar
          git commit -m "Saída da exploração" || true
          git push
