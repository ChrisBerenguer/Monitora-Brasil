name: Teste fontes fiscais (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== OECD RSGLOBAL BRA 2021-2023"
          curl -sS -m 300 "https://sdmx.oecd.org/public/rest/data/OECD.CTP.TPS,DSD_REV_COMP_GLOBAL@DF_RSGLOBAL,/all?startPeriod=2021&endPeriod=2023&format=csvfilewithlabels" -o rs.csv; wc -l rs.csv; head -2 rs.csv
          grep -i "Brazil" rs.csv | head -30
          echo "== IMF ids"
          curl -sS -m 120 -H "Accept: application/json" "https://api.imf.org/external/sdmx/3.0/structure/dataflow/*/*/+" -o imf.json; python3 -c "
          import json; d=json.load(open('imf.json')); fl=d['data']['dataflows']
          print(' '.join(sorted(f['agencyID'].split('.')[-1]+':'+f['id'] for f in fl)))
          "
