name: Teste fontes fiscais (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== GFS todos"
          curl -g -sS -m 600 -H "Accept: application/vnd.sdmx.data+csv;version=2.0.0;labels=id" "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.STA/GFS_SOO/+/*.S13+S1311+S1321.*.NNFAG_A_T+N11A_A_T_MI.POGDP_PT.A?attributes=none" -o g.csv; wc -l g.csv; head -3 g.csv
          python3 - <<'Q'
          import csv
          from collections import defaultdict
          r=list(csv.DictReader(open('g.csv')))
          print(r[0].keys() if r else 'vazio')
          cob=defaultdict(set); bra=defaultdict(dict)
          for x in r:
              k=(x['SECTOR'],x['INDICATOR'])
              cob[k].add(x['COUNTRY'])
              if x['COUNTRY']=='BRA': bra[k][x['TIME_PERIOD']]=round(float(x['OBS_VALUE']),2)
          for k in sorted(cob): print(k, len(cob[k]), 'países;', 'BRA', dict(sorted(bra[k].items())))
          # anos por país para S13 NNFAG
          anos=defaultdict(list)
          for x in r:
              if x['SECTOR']=='S13' and x['INDICATOR']=='N11A_A_T_MI': anos[x['COUNTRY']].append(int(x['TIME_PERIOD']))
          print({c:(min(v),max(v)) for c,v in list(sorted(anos.items()))[:200]})
          Q
