name: Teste fontes fiscais (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for DF in GFS_SOO; do
          echo "== $DF BRA"
          curl -sS -m 300 -H "Accept: application/vnd.sdmx.data+csv;version=2.0.0;labels=both" "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.STA/$DF/+/BRA.*.*.*.*?c[TIME_PERIOD]=ge:2022&attributes=none" -o g.csv; wc -l g.csv; head -2 g.csv
          python3 -c "
          import csv
          r=list(csv.DictReader(open('g.csv')))
          ks=[k for k in r[0] if k not in ('TIME_PERIOD','OBS_VALUE')]
          print(ks)
          seen=set()
          for x in r:
              t=' | '.join(x[k] for k in ks)
              if any(w in t.lower() for w in ['nonfinancial assets','investment','fixed assets','revenue','expense']) and ('gdp' in t.lower() or 'percent' in t.lower()):
                  key=t
                  if key in seen: continue
                  seen.add(key); print(x['TIME_PERIOD'], x['OBS_VALUE'], '|', t[:260])
          " | head -60
          done
