name: Teste fontes fiscais (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== OECD fluxos de receita"
          curl -sS -m 120 "https://sdmx.oecd.org/public/rest/dataflow/all/all/latest" | grep -oE 'id="DSD_REV[^"]*"[^>]*agencyID="[^"]*"' | grep -iv "AFRICA\|LAC@DF_REV[A-Z]\{3\}\"" | sort -u | head -40
          echo "== OECD global"
          curl -sS -m 120 "https://sdmx.oecd.org/public/rest/dataflow/all/all/latest" | grep -oE 'id="[^"]*GLOBAL[^"]*"[^>]*agencyID="[^"]*"' | sort -u | head
          echo "== IMF dataflows"
          curl -sS -m 120 -H "Accept: application/json" "https://api.imf.org/external/sdmx/3.0/structure/dataflow/*/*/+" -o imf.json; python3 -c "
          import json; d=json.load(open('imf.json')); fl=d['data']['dataflows']
          print(len(fl))
          for f in fl:
              n=(f.get('name') or '') if isinstance(f.get('name'),str) else str(f.get('names',{}).get('en',''))
              if any(w in (f['id']+n).upper() for w in ['GFS','FM','FISCAL','ICSD','INVEST']): print(f['agencyID'], f['id'], f['version'], '|', n)
          " || head -c 500 imf.json
