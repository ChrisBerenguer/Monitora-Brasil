name: Atualizar votações da Câmara (Leis e votação)
# Baixa os arquivos anuais de votações da Câmara dos Deputados (Dados Abertos) e grava
# site/data/votacoes.json e site/data/votos/AAAA.json.
# Roda duas vezes por semana e pode ser disparado à mão em Actions → "Atualizar votações da Câmara (Leis e votação)" → Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: '47 8 * * 3,6'   # quarta e sábado, 05h47 em Brasília: pega as sessões de terça e de quarta a sexta
permissions:
  contents: write
concurrency: dados-votacoes
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/coletar_votacoes.py
      - name: Gravar no repositório se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/votacoes.json site/data/votacoes.json dados/votos site/data/votos
          git diff --cached --quiet && echo "Sem mudanças." && exit 0
          git commit -m "Dados: votações nominais da Câmara, coleta automática"
          git push
