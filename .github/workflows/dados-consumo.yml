name: Atualizar dados de consumo básico
# Baixa a cesta básica (DIEESE/Ipeadata), os preços de combustíveis (ANP), o salário mínimo,
# o IPCA e a renda domiciliar per capita (IBGE) e grava site/data/consumo.json.
# Roda todo mês e pode ser disparado à mão em Actions → "Atualizar dados de consumo básico" → Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 12 * *'   # dia 12 de cada mês, 04h23 em Brasília
permissions:
  contents: write
concurrency: dados-consumo
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q openpyxl
      - run: python scripts/coletar_consumo.py
      - name: Gravar no repositório se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/consumo.json site/data/consumo.json
          git diff --cached --quiet && echo "Sem mudanças." && exit 0
          git commit -m "Dados: consumo básico (DIEESE, ANP e IBGE), coleta automática"
          git push
